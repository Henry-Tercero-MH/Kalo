# Infraestructura local del demo.
#   docker compose -f infra/docker-compose.yml up -d            → Postgres+PostGIS y MinIO
#   docker compose -f infra/docker-compose.yml --profile api up  → además la API en contenedor
name: kalo-campo

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalo_demo}
      POSTGRES_DB: ${POSTGRES_DB:-kalo_campo}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kalo} -d ${POSTGRES_DB:-kalo_campo}']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kalo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kalo_demo_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea el bucket de archivos al iniciar.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-kalo} $${S3_SECRET_KEY:-kalo_demo_secret} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-kalo-campo} &&
      echo 'Bucket listo'
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kalo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kalo_demo_secret}
      S3_BUCKET: ${S3_BUCKET:-kalo-campo}

  api:
    profiles: ['api']
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kalo}:${POSTGRES_PASSWORD:-kalo_demo}@db:5432/${POSTGRES_DB:-kalo_campo}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kalo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kalo_demo_secret}
      S3_BUCKET: ${S3_BUCKET:-kalo-campo}
      JWT_SECRET: ${JWT_SECRET:-cambie-este-secreto-en-produccion-0123456789}
      API_PORT: 4000
    ports:
      - '4000:4000'

volumes:
  db_data:
  minio_data:
